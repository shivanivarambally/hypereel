id: basketball_demo_video_v1
name: "Basketball \u2014 short native-video demo"
domain: basketball
highlight_model: event_based
description: A short real-game preview using continuous-video classification. This
  demo recipe prioritizes model evidence over noisy audio/motion proposal strength.
moment_types:
- name: made_basket
  description: 'The subject (a player on the team described in the prompt) makes a
    two-point field goal: the ball passes through the hoop right after their shot,
    jumper, or putback. Do NOT count free throws, misses, or any basket made by the
    opposing team.

    '
  weight: 1.0
  ideal_len: 8
- name: three_pointer
  description: "The subject (a player on the team described in the prompt) makes a\
    \ shot from behind the three-point line \u2014 look for the shot arc and the reaction\
    \ at the make. Exclude misses and any shot by the opposing team.\n"
  weight: 1.3
  ideal_len: 8
- name: layup_or_dunk
  description: 'The subject finishes at the rim with a driving layup, fast-break finish,
    or dunk. Exclude missed attempts and any finish by the opposing team.

    '
  weight: 1.1
  ideal_len: 8
- name: block
  description: "The subject blocks or clearly alters an opposing player's shot with\
    \ their hand \u2014 deflected or swatted away, not merely contested from a distance.\n"
  weight: 1.0
  ideal_len: 6
- name: steal
  description: "The subject takes the ball from an opposing player \u2014 a pick-off\
    \ or a strip \u2014 forcing a change of possession.\n"
  weight: 0.9
  ideal_len: 8
- name: rebound
  description: 'The subject grabs a missed shot out of the air, especially a contested
    board or an offensive rebound that keeps the possession alive.

    '
  weight: 0.7
  ideal_len: 6
signals:
- type: audio_peak
  role: proposer
  weight: 0.1
  params:
    min_peak_db: -12
- type: motion_intensity
  role: proposer
  weight: 0.1
  params:
    window_seconds: 6
- type: vision_classify
  role: scorer
  weight: 0.8
subject_selector:
  type: team_color
  value: the subject described in the runtime prompt
  team_color: 'Identify the subject team from the jersey/scoreboard description in
    the prompt. Set subject_present=true only when a player on that team is making
    the play; set it false for any player on the opposing team, so the opponent''s
    plays are never included.

    '
  audience: individual
  description: Highlights for the team in light-blue jerseys; exclude the team in
    black. Only clearly visible live plays.
selection:
  max_duration: 30
  min_clip: 4
  max_clip: 12
  lead_in: 2
  lead_out: 3
  min_score: 0.5
  ordering: chronological
  coverage: spread across the whole game, not clustered in one segment
  dedup_overlap: true
style:
  transitions: hard_cut
  audio: keep_original
  overlays:
  - player_name
  - score
  format: '16:9'
  platform: local
guardrails:
  never_include:
  - timeouts
  - bench_sequences
  - shaky_camera
  - dead_ball_standing_around
  - warm_ups
  privacy: never center or identify non-subject minors; keep the focus on the subject's
    live action
  grounding: "never label a moment_type the vision scorer isn't confident about \u2014\
    \ degrade to a lower score rather than fabricate a play; when it is unclear whether\
    \ a subject-team player made the play, mark subject_present=false.\n"
acceptance:
- every clip shows a player from the team described in the prompt making the play
- no clip's highlighted play is made by the opposing team
- clips show real basketball plays (basket, three, layup/dunk, block, steal, rebound),
  not padding
- plays are spread across the whole game and not clustered in one segment
- no clip shows a timeout, bench sequence, dead-ball standing around, warm-ups, or
  shaky camera work
